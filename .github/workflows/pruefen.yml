name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: PWA bauen
        run: npm run build
      - name: Tests (Worker in workerd, Web)
        run: npm test
      - name: Performance-Budget
        run: npm run budget
      - name: Sicherheitsprüfung Abhängigkeiten (Produktion)
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E Desktop und Handy
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-spuren
          path: test-results/
          retention-days: 7
