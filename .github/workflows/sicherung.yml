name: Sicherung

# Nächtliche Sicherung der Produktionsdatenbank (D1, EU) – verschlüsselt, 30 Tage aufbewahrt –
# mit anschließendem Wiederherstellungstest in eine frische Datenbank.
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN (D1: Lesen), CLOUDFLARE_ACCOUNT_ID, SICHERUNG_PASSWORT
# Ergänzend bietet D1 „Time Travel“ (Wiederherstellung auf einen Zeitpunkt, siehe docs/Betrieb.md).

on:
  schedule:
    - cron: '30 1 * * *' # 02:30 bzw. 03:30 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicherung
  cancel-in-progress: false

jobs:
  sichern:
    runs-on: ubuntu-latest
    if: ${{ vars.PRODUKTIV == 'ja' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Datenbank exportieren
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export te-zentrale-db --remote --env produktion --output "$RUNNER_TEMP/sicherung.sql"

      - name: Wiederherstellung prüfen
        run: node scripts/wiederherstellung-testen.mjs "$RUNNER_TEMP/sicherung.sql"

      - name: Verschlüsseln
        env:
          SICHERUNG_PASSWORT: ${{ secrets.SICHERUNG_PASSWORT }}
        run: |
          test -n "$SICHERUNG_PASSWORT" || { echo "SICHERUNG_PASSWORT fehlt"; exit 1; }
          gzip -9 "$RUNNER_TEMP/sicherung.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/sicherung.sql.gz" -out "$RUNNER_TEMP/te-zentrale-$(date -u +%Y-%m-%d).sql.gz.enc" -pass env:SICHERUNG_PASSWORT
          rm -f "$RUNNER_TEMP/sicherung.sql.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: te-zentrale-sicherung-${{ github.run_id }}
          path: ${{ runner.temp }}/te-zentrale-*.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
